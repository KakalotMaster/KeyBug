<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Console</title>
<style>
  :root {
    --bg: #0B0D0F;
    --panel: #14171B;
    --panel-line: #262B31;
    --ink: #D7DBDE;
    --ink-dim: #767E86;
    --phosphor: #6EE7C8;
    --phosphor-dim: #2E6E5F;
    --amber: #FFB454;
    --danger: #E5654B;
    --mono: "SF Mono", "JetBrains Mono", "Roboto Mono", Consolas, monospace;
    --sans: -apple-system, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 20px;
  }

  .frame {
    max-width: 920px;
    margin: 0 auto;
  }

  /* ---- Header ---- */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 16px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--panel-line);
  }

  header h1 {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .status-pill {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-dim);
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--danger);
    transition: background 0.2s;
  }
  .dot.live { background: var(--phosphor); box-shadow: 0 0 6px var(--phosphor); }

  /* ---- Connect bar ---- */
  .connect-bar {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr auto;
    gap: 8px;
    margin-bottom: 20px;
  }

  input {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    color: var(--ink);
    padding: 9px 11px;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 12.5px;
    outline: none;
  }
  input:focus { border-color: var(--phosphor-dim); }
  input::placeholder { color: var(--ink-dim); }

  button {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    border-radius: 6px;
    border: 1px solid var(--panel-line);
    background: var(--panel);
    color: var(--ink);
    padding: 9px 14px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  button:hover { border-color: var(--ink-dim); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  button.primary {
    background: var(--phosphor);
    border-color: var(--phosphor);
    color: #06231D;
  }
  button.primary:hover { background: #85F0D5; }

  button.danger {
    background: var(--danger);
    border-color: var(--danger);
    color: #2A0D06;
  }

  /* ---- Grid layout ---- */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1.3fr;
    gap: 14px;
    margin-bottom: 14px;
  }

  @media (max-width: 720px) {
    .grid { grid-template-columns: 1fr; }
    .connect-bar { grid-template-columns: 1fr 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    padding: 16px;
  }

  .panel h2 {
    font-size: 11px;
    text-transform: none;
    letter-spacing: 0.02em;
    color: var(--ink-dim);
    margin: 0 0 12px 0;
    font-weight: 500;
  }

  /* ---- Device list ---- */
  .device-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--panel-line);
    font-family: var(--mono);
    font-size: 13px;
  }
  .device-row:last-child { border-bottom: none; }
  .device-row .role { color: var(--ink-dim); font-size: 11px; }
  .empty-note { color: var(--ink-dim); font-size: 12.5px; font-family: var(--mono); }

  /* ---- Call panel ---- */
  .call-face {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 10px 0 4px 0;
  }

  .call-status {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--ink-dim);
    min-height: 16px;
  }

  .ring {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: 2px solid var(--panel-line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 22px;
    color: var(--ink-dim);
    transition: border-color 0.3s, color 0.3s;
  }
  .ring.active {
    border-color: var(--phosphor);
    color: var(--phosphor);
    box-shadow: 0 0 18px -4px var(--phosphor);
  }
  .ring.incoming {
    border-color: var(--amber);
    color: var(--amber);
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0px transparent; }
    50% { box-shadow: 0 0 20px -2px var(--amber); }
  }

  .call-controls { display: flex; gap: 8px; margin-top: 4px; }

  /* ---- Device control form ---- */
  .cmd-form {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 8px;
  }

  /* ---- Log ---- */
  .log {
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--ink-dim);
    max-height: 190px;
    overflow-y: auto;
  }
  .log .entry { white-space: pre-wrap; word-break: break-all; }
  .log .entry.in { color: var(--phosphor); }
  .log .entry.out { color: var(--ink); }
  .log .entry.err { color: var(--danger); }
</style>
</head>
<body>
<div class="frame">

  <header>
    <h1>Watch Console</h1>
    <div class="status-pill"><span class="dot" id="connDot"></span><span id="connLabel">disconnected</span></div>
  </header>

  <div class="connect-bar">
    <input id="serverUrl" placeholder="wss://your-app.onrender.com/ws" value="ws://localhost:3000/ws">
    <input id="clientId" placeholder="id (e.g. console-1)" value="console-1">
    <input id="authToken" placeholder="token (optional)">
    <button class="primary" id="connectBtn">Connect</button>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>Connected clients</h2>
      <div id="deviceList"><div class="empty-note">not connected</div></div>
    </div>

    <div class="panel">
      <h2>Call</h2>
      <div class="call-face">
        <div class="ring" id="callRing">•</div>
        <div class="call-status" id="callStatus">idle</div>
      </div>
      <div class="connect-bar" style="grid-template-columns: 1fr auto; margin-top: 10px; margin-bottom: 0;">
        <input id="callTarget" placeholder="target id to call">
        <button class="primary" id="callBtn">Call</button>
      </div>
      <div class="call-controls" id="callControls" style="display:none;">
        <button class="primary" id="acceptBtn">Accept</button>
        <button class="danger" id="endBtn">Hang up</button>
      </div>
    </div>
  </div>

  <div class="panel" style="margin-bottom:14px;">
    <h2>Send device command</h2>
    <div class="cmd-form">
      <input id="cmdTarget" placeholder="target device id">
      <input id="cmdAction" placeholder="action (e.g. toggle)">
      <button id="cmdBtn">Send</button>
    </div>
  </div>

  <div class="panel">
    <h2>Log</h2>
    <div class="log" id="log"></div>
  </div>

</div>

<script>
let ws = null;
let audioCtx = null;
let micStream = null;
let micProcessor = null;
let currentCallId = null;
let incomingCallId = null;
let incomingFrom = null;
let playbackTime = 0;

const $ = (id) => document.getElementById(id);

function logLine(text, cls) {
  const el = document.createElement("div");
  el.className = "entry " + (cls || "");
  el.textContent = text;
  const log = $("log");
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

function setConnected(isConnected) {
  $("connDot").classList.toggle("live", isConnected);
  $("connLabel").textContent = isConnected ? "connected" : "disconnected";
  $("connectBtn").textContent = isConnected ? "Disconnect" : "Connect";
}

function renderDevices(devices) {
  const container = $("deviceList");
  if (!devices || devices.length === 0) {
    container.innerHTML = '<div class="empty-note">no clients connected</div>';
    return;
  }
  container.innerHTML = "";
  devices.forEach((d) => {
    const row = document.createElement("div");
    row.className = "device-row";
    row.innerHTML = `<span>${d.id}</span><span class="role">${d.role}</span>`;
    container.appendChild(row);
  });
}

function setCallUI(state, label) {
  const ring = $("callRing");
  ring.className = "ring" + (state === "active" ? " active" : state === "incoming" ? " incoming" : "");
  $("callStatus").textContent = label;
  $("callControls").style.display = state === "incoming" || state === "active" ? "flex" : "none";
  $("acceptBtn").style.display = state === "incoming" ? "inline-block" : "none";
}

// ---- Connection ----

$("connectBtn").addEventListener("click", () => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.close();
    return;
  }
  const base = $("serverUrl").value.trim();
  const id = $("clientId").value.trim();
  const token = $("authToken").value.trim();
  if (!base || !id) { logLine("server URL and id are required", "err"); return; }

  const url = new URL(base);
  url.searchParams.set("id", id);
  url.searchParams.set("role", "browser");
  if (token) url.searchParams.set("token", token);

  ws = new WebSocket(url.toString());
  ws.binaryType = "arraybuffer";

  ws.onopen = () => { setConnected(true); logLine("connected as " + id, "in"); };
  ws.onclose = () => { setConnected(false); logLine("disconnected", "err"); renderDevices([]); };
  ws.onerror = () => logLine("websocket error", "err");

  ws.onmessage = (event) => {
    if (event.data instanceof ArrayBuffer) {
      playAudioFrame(event.data);
      return;
    }
    let msg;
    try { msg = JSON.parse(event.data); } catch { return; }
    logLine("← " + JSON.stringify(msg), "in");
    handleMessage(msg);
  };
});

function handleMessage(msg) {
  switch (msg.type) {
    case "welcome":
    case "device_list":
      renderDevices(msg.devices || (msg.connected || []).map((id) => ({ id, role: "?" })));
      break;
    case "call_incoming":
      incomingCallId = msg.callId;
      incomingFrom = msg.from;
      setCallUI("incoming", "incoming call from " + msg.from);
      break;
    case "call_ringing":
      currentCallId = msg.callId;
      setCallUI("incoming", "ringing " + msg.target + "...");
      break;
    case "call_accepted":
      currentCallId = msg.callId;
      startMic();
      setCallUI("active", "on call");
      break;
    case "call_rejected":
      setCallUI("idle", "call rejected");
      currentCallId = null;
      break;
    case "call_ended":
      stopMic();
      setCallUI("idle", "call ended");
      currentCallId = null;
      break;
    case "call_failed":
      setCallUI("idle", "call failed: " + msg.reason);
      break;
    case "error":
      logLine("server error: " + msg.message, "err");
      break;
  }
}

function send(obj) {
  if (!ws || ws.readyState !== WebSocket.OPEN) { logLine("not connected", "err"); return; }
  ws.send(JSON.stringify(obj));
  logLine("→ " + JSON.stringify(obj), "out");
}

// ---- Device commands ----

$("cmdBtn").addEventListener("click", () => {
  const target = $("cmdTarget").value.trim();
  const action = $("cmdAction").value.trim();
  if (!target || !action) { logLine("target and action are required", "err"); return; }
  send({ type: "device_command", target, action });
});

// ---- Calls ----

$("callBtn").addEventListener("click", () => {
  const target = $("callTarget").value.trim();
  if (!target) { logLine("enter a target id to call", "err"); return; }
  send({ type: "call_invite", target });
});

$("acceptBtn").addEventListener("click", () => {
  if (!incomingCallId) return;
  send({ type: "call_accept", callId: incomingCallId });
  currentCallId = incomingCallId;
  startMic();
  setCallUI("active", "on call with " + incomingFrom);
  incomingCallId = null;
});

$("endBtn").addEventListener("click", () => {
  if (!currentCallId) return;
  send({ type: "call_end", callId: currentCallId });
  stopMic();
  setCallUI("idle", "idle");
  currentCallId = null;
});

// ---- Audio: capture mic as 16-bit PCM, 16kHz mono, send as binary frames ----

async function startMic() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, sampleRate: 16000 } });
    const source = audioCtx.createMediaStreamSource(micStream);
    micProcessor = audioCtx.createScriptProcessor(2048, 1, 1);

    micProcessor.onaudioprocess = (e) => {
      if (!ws || ws.readyState !== WebSocket.OPEN || !currentCallId) return;
      const input = e.inputBuffer.getChannelData(0);
      const pcm16 = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        const s = Math.max(-1, Math.min(1, input[i]));
        pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      ws.send(pcm16.buffer);
    };

    // ScriptProcessorNode only fires onaudioprocess if it's connected to a
    // destination, so route it through a silent gain node to avoid mic feedback.
    const silentGain = audioCtx.createGain();
    silentGain.gain.value = 0;
    source.connect(micProcessor);
    micProcessor.connect(silentGain);
    silentGain.connect(audioCtx.destination);

    playbackTime = audioCtx.currentTime;
    logLine("microphone streaming started", "in");
  } catch (err) {
    logLine("mic error: " + err.message, "err");
  }
}

function stopMic() {
  if (micProcessor) { micProcessor.disconnect(); micProcessor = null; }
  if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
}

// Play a received binary audio frame (assumed 16-bit PCM, 16kHz mono)
function playAudioFrame(arrayBuffer) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  const pcm16 = new Int16Array(arrayBuffer);
  const float32 = new Float32Array(pcm16.length);
  for (let i = 0; i < pcm16.length; i++) float32[i] = pcm16[i] / 0x8000;

  const buffer = audioCtx.createBuffer(1, float32.length, 16000);
  buffer.copyToChannel(float32, 0);

  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  source.connect(audioCtx.destination);

  const now = audioCtx.currentTime;
  const startAt = Math.max(now, playbackTime);
  source.start(startAt);
  playbackTime = startAt + buffer.duration;
}
</script>
</body>
</html>
